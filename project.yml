# 王牌酒保 Ace Bartender：原生 iOS App（SwiftUI；規則核心 = 網頁版 public/js 打包成 App/Data/core.js，在 JavaScriptCore 跑，不是 WebView）。
# CI 產生 AceBartender.xcodeproj（不進 git）：brew install xcodegen && xcodegen generate
name: AceBartender
options:
  bundleIdPrefix: com.austin410203
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: M3FNV67WZ3
    SWIFT_VERSION: "5.0"
targets:
  AceBartender:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
        excludes: ["Data", "Images", "Loc", "PrivacyInfo.xcprivacy"]
      - path: App/Data
        type: folder
      - path: App/Images
        type: folder
      - path: App/Loc
      - path: App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austin410203.acebartender
        PRODUCT_NAME: AceBartender
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "NO"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 王牌酒保
        CFBundleDevelopmentRegion: zh_TW
        CFBundleLocalizations: [zh-Hant, en, ja, ko, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: 按住說話時用麥克風聽你點酒，放開後文字會進輸入框。
        NSSpeechRecognitionUsageDescription: 把你說的話轉成文字，放進輸入框讓你改好再送出。
        NSPhotoLibraryAddUsageDescription: 把酒譜卡圖片存進你的照片。
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
